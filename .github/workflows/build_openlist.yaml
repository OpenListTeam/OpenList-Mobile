name: Build OpenList Libraries

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: Reuse bindings built from the same sources and upstream tag
        type: boolean
        default: true
  workflow_call:
    inputs:
      use_cache:
        description: Reuse bindings built from the same sources and upstream tag
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    name: Get OpenList Version Information
    runs-on: ubuntu-latest
    outputs:
      openlist_version: ${{ steps.openlist_version.outputs.openlist_version }}
      openlist_git_commit: ${{ steps.openlist_version.outputs.openlist_git_commit }}
      openlist_web_version: ${{ steps.openlist_version.outputs.openlist_web_version }}
      openlist_built_at: ${{ steps.openlist_version.outputs.openlist_built_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download OpenList Source Code
        run: |
          cd $GITHUB_WORKSPACE/openlist-lib/scripts
          chmod +x *.sh
          ./init_openlist.sh

      - name: Extract OpenList Version Info
        id: openlist_version
        run: |
          cd $GITHUB_WORKSPACE/openlist-lib/scripts
          
          GIT_REPO="https://github.com/OpenListTeam/OpenList.git"
          OPENLIST_VERSION=$(git -c 'versionsort.suffix=-' ls-remote --exit-code --refs --sort='version:refname' --tags $GIT_REPO | tail -n 1 | cut -d'/' -f3)
          OPENLIST_GIT_COMMIT=$(git ls-remote $GIT_REPO "refs/tags/${OPENLIST_VERSION}" | cut -f1 | cut -c1-7)
          OPENLIST_WEB_VERSION=$(curl -fsSL --max-time 10 "https://api.github.com/repos/OpenListTeam/OpenList-Frontend/releases/latest" | grep "tag_name" | head -n 1 | awk -F ":" '{print $2}' | sed 's/"//g;s/,//g;s/ //g' || echo "rolling")
          OPENLIST_BUILT_AT=$(date +'%F %T %z')
          
          echo "openlist_version=${OPENLIST_VERSION}" >> $GITHUB_OUTPUT
          echo "openlist_git_commit=${OPENLIST_GIT_COMMIT}" >> $GITHUB_OUTPUT
          echo "openlist_web_version=${OPENLIST_WEB_VERSION}" >> $GITHUB_OUTPUT
          echo "openlist_built_at=${OPENLIST_BUILT_AT}" >> $GITHUB_OUTPUT

  build_android:
    name: Build OpenList Android AAR
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The binding only depends on openlist-lib, this workflow, the upstream
      # tags and the Go toolchain, so an exact key match is safe to reuse
      # (tests included: a cache is only saved after they passed).
      - name: Restore OpenList Android AAR
        id: cache
        if: inputs.use_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/android/app/libs
          key: openlist-aar-go1.25.0-${{ needs.version.outputs.openlist_version }}-${{ needs.version.outputs.openlist_web_version }}-${{ hashFiles('openlist-lib/**', '.github/workflows/build_openlist.yaml') }}

      - name: Download OpenList Source Code
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd $GITHUB_WORKSPACE/openlist-lib/scripts
          chmod +x *.sh
          ./init_openlist.sh
          ./init_web.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.3"

      - uses: actions/setup-java@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ndk-version: r28c

      - name: Setup Gradle
        if: steps.cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6

      # Tests run after init_gomobile.sh because its `go get` calls resolve
      # the go.mod edits made by init_openlist.sh; before that go.mod is stale.
      - name: Test and Build OpenList Android AAR
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd $GITHUB_WORKSPACE/openlist-lib/scripts
          chmod +x *.sh
          ./init_gomobile.sh
          (cd .. && go test -count=1 ./openlistlib/...)
          ./gobind.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          OPENLIST_VERSION: ${{ needs.version.outputs.openlist_version }}
          OPENLIST_WEB_VERSION: ${{ needs.version.outputs.openlist_web_version }}
          OPENLIST_BUILT_AT: ${{ needs.version.outputs.openlist_built_at }}
          OPENLIST_GIT_COMMIT: ${{ needs.version.outputs.openlist_git_commit }}
          OPENLIST_GIT_AUTHOR: The OpenList Projects Contributors <noreply@oplist.org>

      - name: Save OpenList Android AAR
        if: steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/android/app/libs
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload OpenList Android AAR
        uses: actions/upload-artifact@v5
        with:
          name: "openlist-android-aar"
          path: "${{ github.workspace }}/android/app/libs/*.aar"
          retention-days: 50

  build_ios:
    name: Build OpenList iOS Framework
    needs: [version]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Restore OpenList iOS Framework
        id: cache
        if: inputs.use_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/ios/Frameworks
          key: openlist-xcframework-go1.25.0-${{ needs.version.outputs.openlist_version }}-${{ needs.version.outputs.openlist_web_version }}-${{ hashFiles('openlist-lib/**', '.github/workflows/build_openlist.yaml') }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.3"

      - name: Download OpenList Source Code
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd $GITHUB_WORKSPACE/openlist-lib/scripts
          chmod +x *.sh
          ./init_openlist.sh
          ./init_web_ios.sh

      - name: Build OpenList iOS Framework
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd $GITHUB_WORKSPACE/openlist-lib/scripts
          chmod +x *.sh
          ./init_gomobile.sh
          ./gobind_ios.sh
        env:
          OPENLIST_VERSION: ${{ needs.version.outputs.openlist_version }}
          OPENLIST_WEB_VERSION: ${{ needs.version.outputs.openlist_web_version }}
          OPENLIST_BUILT_AT: ${{ needs.version.outputs.openlist_built_at }}
          OPENLIST_GIT_COMMIT: ${{ needs.version.outputs.openlist_git_commit }}
          OPENLIST_GIT_AUTHOR: The OpenList Projects Contributors <noreply@oplist.org>

      - name: Save OpenList iOS Framework
        if: steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/ios/Frameworks
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload OpenList iOS Framework
        uses: actions/upload-artifact@v5
        with:
          name: "openlist-ios-xcframework"
          path: "${{ github.workspace }}/ios/Frameworks/*.xcframework"
          retention-days: 50
